# Auto theme -- Ghostty colors (generated by matugen).
# Pure black background with pastel accents from the wallpaper.

background = 000000
foreground = {{colors.on_surface.default.hex_stripped}}
cursor-color = {{colors.primary.default.hex_stripped}}
cursor-text = 000000
selection-background = {{colors.surface_container.default.hex_stripped}}
selection-foreground = {{colors.on_surface.default.hex_stripped}}

# black
palette = 0={{colors.surface_container_low.default.hex}}
palette = 8={{colors.outline.default.hex}}
# red
palette = 1={{colors.error.default.hex}}
palette = 9={{colors.error_container.default.hex}}
# green
palette = 2={{colors.primary.default.hex}}
palette = 10={{colors.primary_fixed.default.hex}}
# yellow
palette = 3={{colors.tertiary.default.hex}}
palette = 11={{colors.tertiary_fixed.default.hex}}
# blue
palette = 4={{colors.secondary.default.hex}}
palette = 12={{colors.secondary_fixed.default.hex}}
# magenta
palette = 5={{colors.tertiary_fixed_dim.default.hex}}
palette = 13={{colors.tertiary_fixed.default.hex}}
# cyan
palette = 6={{colors.secondary_fixed_dim.default.hex}}
palette = 14={{colors.secondary_fixed.default.hex}}
# white
palette = 7={{colors.on_surface.default.hex}}
palette = 15={{colors.on_primary_container.default.hex}}
