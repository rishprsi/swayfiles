# gtklock -- lock screen (started by ~/.config/sway/scripts/lock.sh, which
# also passes the style and the "locked" hook). Options: gtklock --help-config
[main]
gtk-theme=Adwaita-dark
modules=userinfo-module
time-format=%-I:%M
date-format=%A, %B %d
# Hide the password form after 30s without input; any key/motion shows it.
idle-hide=true
idle-timeout=30

[userinfo]
under-clock=true
image-size=96
