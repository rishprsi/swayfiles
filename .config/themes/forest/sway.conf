client.focused_inactive #1e241eaa #000000 #7a857a #1e241eaa #1e241eaa
client.unfocused        #1e241eaa #000000 #7a857a #1e241eaa #1e241eaa
client.urgent           #c9a3a3 #000000 #d0d6d0 #c9a3a3 #c9a3a3
